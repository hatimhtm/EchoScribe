[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echoscribe"
version = "3.0.0"
description = "Audio → Whisper → structured meeting intelligence. One OpenAI key, CLI + FastAPI server + watch mode."
readme = "README.md"
license = "MIT"
authors = [{ name = "Hatim El Hassak", email = "hatimelhassak.official@gmail.com" }]
keywords = ["meeting", "transcription", "whisper", "summarization", "slack", "openai", "ai", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Conferencing",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "slack-sdk>=3.27.0",
    "python-dotenv>=1.0.0",
    "pydub>=0.25.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]
watch = [
    "watchdog>=4.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "watchdog>=4.0.0",
]

[project.scripts]
echoscribe = "echoscribe.cli:main"

[project.urls]
Homepage = "https://github.com/hatimhtm/EchoScribe"
Repository = "https://github.com/hatimhtm/EchoScribe"
Issues = "https://github.com/hatimhtm/EchoScribe/issues"
Changelog = "https://github.com/hatimhtm/EchoScribe/releases"

[tool.hatch.build.targets.wheel]
packages = ["echoscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=echoscribe --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]  # handled by formatter

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
